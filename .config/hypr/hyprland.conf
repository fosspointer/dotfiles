monitor=,1920x1080@239.76,auto,auto
exec-once = eww o bar & hyprpaper & lxqt-policykit-agent & syncthing &
exec-once = kitty -d ~/quirky sh -c ./start.sh &
exec-once = cd /home/nephele/dev/nerd_bot && npm run start &

$terminal = kitty
$file_manager = thunar
$browser = zen-browser
$menu = tofi-run
$menu2 = tofi-drun
$edit_config = vscodium ~/.config

windowrule = float, class:lxqt-policykit-agent

env = XCURSOR_THEME,volantes_cursors
env = XCURSOR_SIZE,32
env = QT_QPA_PLATFORMTHEME,qt6ct
env = XDG_MENU_PREFIX,plasma-

exec-once = kbuildsycoca6 --noincremental &

dwindle {
    preserve_split = true
}

input {
    kb_layout = us,gr,us
    kb_variant = altgr-intl,polytonic,rus
    kb_model =
    kb_options = compose:menu
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = no
    }

    sensitivity = 0
}

general {
    gaps_in = 5
    gaps_out = 20
    border_size = 2
    col.active_border = rgba(ff79c6ee) rgba(bd93f9ee) 45deg
    col.inactive_border = rgba(282a36ee) rgba(44475aee) 45deg
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 3
        passes = 1
    }
    shadow {
        enabled = true
        ignore_window = true
        range = 20
        offset = 0 2
        render_power = 4
        color = rgba(0000002A)
    }
}

animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.0
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

gestures {
    workspace_swipe = off
}

misc {
    force_default_wallpaper = -1
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

windowrule = bordercolor rgb(FF79C6) rgb(BD93F9) rgb(8BE9FD), class:^(kitty)$
windowrule = float,class:^(org.pulseaudio.pavucontrol)$
windowrule = size 800 600,class:^(org.pulseaudio.pavucontrol)$
windowrule = move 1080 60,class:^(org.pulseaudio.pavucontrol)$
windowrule = pin, class:^(org.pulseaudio.pavucontrol)
windowrulev2 = suppressevent maximize, class:.*
$mod = SUPER

bind = $mod, t, exec, xdotool click 1
bind = $mod, y, exec, xdotool click 3
bind = $mod, p, exec, vesktop
bind = $mod, p, exec, hyprctl dispatch movetoworkspace "$(hyprctl activeworkspace | grep 'workspace ID' | awk '{print $3}'),title:Vesktop"

bind = $mod, x, exec, hyprctl switchxkblayout usb-usb-keyboard 0
bind = $mod, c, exec, hyprctl switchxkblayout usb-usb-keyboard 1
bind = $mod, v, exec, hyprctl switchxkblayout usb-usb-keyboard 2

bind = $mod alt, escape, exec, ~/.config/wofi/power_menu.sh
bind = $mod, Return, exec, $terminal
bind = $mod, n, exec, $browser
bind = $mod, w, killactive
bind = $mod shift, q, exit 
bind = $mod, m, exec, $file_manager
bind = $mod, e, togglefloating
bind = $mod, d, exec, $($menu)
bind = $mod, f, exec, $($menu2)
bind = $mod alt, f, fullscreen
bind = $mod, r, pseudo
bind = $mod, q, togglesplit
bind = $mod, period, exec, wofimoji -a "type" -t "light"
bind = $mod, slash, exec, $edit_config
bind = $mod, Print, exec, grim ~/Pictures/screenshot_$(date +"%d-%m-%Y-%H:%M:%S").png

bind = $mod shift, s, exec, sh ~/.config/hypr/screenshot.sh
bind = $mod ctrl alt, h, swapwindow, l
bind = $mod ctrl alt, j, swapwindow, d
bind = $mod ctrl alt, k, swapwindow, u
bind = $mod ctrl alt, l, swapwindow, r

bind = $mod, h, movefocus, l
bind = $mod, l, movefocus, r
bind = $mod, k, movefocus, u
bind = $mod, j, movefocus, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

bind = $mod, z, cyclenext

binde = $mod alt, h, resizeactive, -75 0
binde = $mod alt, j, resizeactive, 0 75
binde = $mod alt, k, resizeactive, 0 -75
binde = $mod alt, l, resizeactive, 75 0

binde = $mod ctrl, h, moveactive, -75 0
binde = $mod ctrl, j, moveactive, 0 75
binde = $mod ctrl, k, moveactive, 0 -75
binde = $mod ctrl, l, moveactive, 75 0

bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
